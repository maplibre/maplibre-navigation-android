[versions]
agp = "9.4.1"
kotlin = "2.4.21"

maplibre = "13.6.1"
spatial-k = "0.8.0"
maplibre-navigation = "5.1.0-pre1"

kotlinx-serialization-json = "1.11.0"

coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
activity = "1.13.0"
constraintlayout = "2.2.2"

okhttp = "5.5.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }

okhttp =  { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# MapLibre
maplibre = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }
spatialk-geojson = { group = "org.maplibre.spatialk", name = "geojson", version.ref = "spatial-k" }
spatialk-turf = { group = "org.maplibre.spatialk", name = "turf", version.ref = "spatial-k" }
maplibre-navigation-core = { group = "org.maplibre.navigation", name = "navigation-core", version.ref = "maplibre-navigation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

